name: Deploy → QA

# Triggers on every push to `development`. Runs after CI passes, in order:
#   1. Apply pending Prisma migrations to the QA Supabase project
#   2. Deploy the Next.js storefront (which now also serves the API under
#      /api/* as route handlers) to the QA Vercel project
#   3. Run smoke tests against the live URL
#
# The API is no longer a separate Railway service — it's part of the Next.js
# app, so there's a single deploy target. Each step gates on the previous — a
# migration failure means we never push
# would call into a 500ing API.
#
# --- REQUIRED GITHUB SECRETS (scoped to the `qa` environment) -------------
# Settings → Environments → qa → Add secret
#
# DATABASE_URL                  postgres://… on aws-…pooler.supabase.com:6543
# DIRECT_URL                    postgres://… on db.<ref>.supabase.co:5432
# VERCEL_TOKEN                  vercel.com/account/tokens
# VERCEL_ORG_ID                 vercel project settings → general
# VERCEL_PROJECT_ID             vercel project settings → general
#
# (No Railway secrets anymore — the API ships inside the Next.js app.)
#
# --- REQUIRED GITHUB VARIABLES (scoped to the `qa` environment) ----------
# Settings → Environments → qa → Add variable (NOT secret — these are URLs)
#
# QA_WEB_URL                    https://qa.vivasvana.com   (also serves /api/*)
#
# --- TO SET UP ------------------------------------------------------------
#   1. Disable Vercel native GitHub auto-deploy on the QA project.
#      We orchestrate the order from this workflow.
#   2. Settings → Environments → "qa" → add the secrets + 1 variable above.
#   3. Push to `development`. First run will take ~3 min; subsequent ~90 s.

on:
  push:
    branches: [development]
  workflow_dispatch: {} # manual trigger if you need to re-deploy without a code change

concurrency:
  # Only one QA deploy at a time — `cancel-in-progress: false` so an
  # in-flight migrate isn't aborted halfway.
  group: deploy-qa
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1
  # See ci.yml for rationale — opt into Node 24 ahead of GitHub's
  # 2026-06-16 cutoff so the deprecation warnings stop and we exercise
  # the new runtime before it becomes mandatory.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Hard requirement: CI must be green for this commit before we deploy.
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow to succeed
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Lint, typecheck, test'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

  migrate:
    name: Apply migrations (QA Supabase)
    needs: wait-for-ci
    runs-on: ubuntu-latest
    environment: qa
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply pending migrations
        # `migrate deploy` is idempotent — no-op if nothing pending. Never
        # `migrate dev` here; that opens an interactive prompt and can
        # rewrite history.
        run: pnpm --filter @vivasvana/db run migrate:deploy

      - name: Seed catalog (QA only — idempotent upsert by slug)
        # Bypass the `seed` package.json script because it has
        # `tsx --env-file=.env` which crashes when .env isn't on disk
        # (CI injects env vars directly). Same prisma/seed.ts source.
        run: pnpm --filter @vivasvana/db exec tsx prisma/seed.ts

  deploy-web:
    name: Deploy Web → Vercel (QA)
    needs: migrate
    runs-on: ubuntu-latest
    environment: qa
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull env from Vercel (production scope)
        # `--environment=production` is correct even for the QA *project* —
        # we have a SEPARATE Vercel project per environment, so each
        # project's "production" target is its own QA deployment.
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # Pass the URL through an intermediate job that DOES declare
  # `environment: qa` so the GitHub vars resolver looks in the qa
  # environment (where QA_WEB_URL / QA_API_URL live). A bare reusable-
  # workflow `uses:` job doesn't accept `environment:` directly, and the
  # `with:` inputs are evaluated in the caller's job scope — without an
  # env declaration there they fall back to repo-level vars (which are
  # empty), so the smoke step gets blank URLs and curl 400s.
  collect-urls:
    name: Resolve QA URLs
    needs: deploy-web
    runs-on: ubuntu-latest
    environment: qa
    outputs:
      web_url: ${{ steps.urls.outputs.web_url }}
      api_url: ${{ steps.urls.outputs.api_url }}
    steps:
      - id: urls
        run: |
          echo "web_url=${{ vars.QA_WEB_URL }}" >> "$GITHUB_OUTPUT"
          # The API now lives under the web origin (/api/*), so api_url == web_url.
          echo "api_url=${{ vars.QA_WEB_URL }}" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke tests
    needs: collect-urls
    uses: ./.github/workflows/_smoke.yml
    with:
      web_url: ${{ needs.collect-urls.outputs.web_url }}
      api_url: ${{ needs.collect-urls.outputs.api_url }}

  notify-failure:
    name: Mark deploy failed
    needs: [migrate, deploy-web, collect-urls, smoke]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Surface failure summary
        run: |
          {
            echo "## QA deploy failed"
            echo "Commit: \`${{ github.sha }}\`"
            echo "Author: ${{ github.actor }}"
            echo ""
            echo "Roll back from the Vercel dashboard if the live QA env is"
            echo "in a broken state."
          } >> "$GITHUB_STEP_SUMMARY"
