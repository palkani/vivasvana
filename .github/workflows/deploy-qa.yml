name: Deploy → QA

# Triggers on every push to `development`. Runs after CI passes, in order:
#   1. Apply pending Prisma migrations to the QA Supabase project
#   2. Deploy the Fastify API to the QA Railway service
#   3. Deploy the Next.js storefront to the QA Vercel project
#   4. Run smoke tests against the live URLs
#
# Each step gates on the previous — a migration failure means we never push
# stale-schema code; an API failure means we don't deploy a web build that
# would call into a 500ing API.
#
# --- REQUIRED GITHUB SECRETS (scoped to the `qa` environment) -------------
#
# DATABASE_URL                  postgres://… on aws-…pooler.supabase.com:6543
# DIRECT_URL                    postgres://… on db.<ref>.supabase.co:5432
# VERCEL_TOKEN                  vercel.com/account/tokens
# VERCEL_ORG_ID                 vercel project settings → general
# VERCEL_PROJECT_ID             vercel project settings → general
# RAILWAY_TOKEN                 railway.com → tokens → "Project Token" for QA
# RAILWAY_SERVICE_ID            railway.com → service → settings → service id
# QA_WEB_URL                    https://qa.vivasvana.com
# QA_API_URL                    https://api-qa.vivasvana.com
#
# --- TO SET UP ------------------------------------------------------------
#   1. Disable Vercel + Railway native GitHub auto-deploy on the QA project.
#      We orchestrate the order from this workflow.
#   2. Settings → Environments → "qa" → add the 9 secrets above.
#   3. Push to `development`. First run will take ~3 min; subsequent ~90 s.

on:
  push:
    branches: [development]
  workflow_dispatch: {} # manual trigger if you need to re-deploy without a code change

concurrency:
  # Only one QA deploy at a time — `cancel-in-progress: false` so an
  # in-flight migrate isn't aborted halfway.
  group: deploy-qa
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Hard requirement: CI must be green for this commit before we deploy.
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow to succeed
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Lint, typecheck, test'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

  migrate:
    name: Apply migrations (QA Supabase)
    needs: wait-for-ci
    runs-on: ubuntu-latest
    environment: qa
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply pending migrations
        # `migrate deploy` is idempotent — no-op if nothing pending. Never
        # `migrate dev` here; that opens an interactive prompt and can
        # rewrite history.
        run: pnpm --filter @vivasvana/db run migrate:deploy

  deploy-api:
    name: Deploy API → Railway (QA)
    needs: migrate
    runs-on: ubuntu-latest
    environment: qa
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: |
          # Pin a known-good version so a CLI breaking change doesn't
          # silently break the pipeline. Bump intentionally.
          curl -fsSL https://railway.com/install.sh | sh
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # --service forces this token to deploy the right service even if
        # the project has multiple. --detach returns once Railway has the
        # build queued; we don't wait for the runtime to come up here
        # because the smoke-test job polls /health below.
        run: |
          railway up \
            --service "${{ secrets.RAILWAY_SERVICE_ID }}" \
            --detach

      - name: Poll /health until healthy
        # 90-second window for the new container to boot. Railway usually
        # flips traffic within 30 s. If we never see a 200 the smoke job
        # will fail anyway — this just produces a clearer error message.
        run: |
          for i in $(seq 1 18); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "${{ secrets.QA_API_URL }}/health" || true)
            if [ "$code" = "200" ]; then
              echo "::notice::API healthy after ${i}× 5s polls"
              exit 0
            fi
            sleep 5
          done
          echo "::error::API /health never returned 200 within 90 s"
          exit 1

  deploy-web:
    name: Deploy Web → Vercel (QA)
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: qa
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull env from Vercel (production scope)
        # `--environment=production` is correct even for the QA *project* —
        # we have a SEPARATE Vercel project per environment, so each
        # project's "production" target is its own QA deployment.
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  smoke:
    name: Smoke tests
    needs: deploy-web
    uses: ./.github/workflows/_smoke.yml
    with:
      web_url: ${{ vars.QA_WEB_URL }}
      api_url: ${{ vars.QA_API_URL }}

  notify-failure:
    name: Mark deploy failed
    needs: [migrate, deploy-api, deploy-web, smoke]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Surface failure summary
        run: |
          {
            echo "## QA deploy failed"
            echo "Commit: \`${{ github.sha }}\`"
            echo "Author: ${{ github.actor }}"
            echo ""
            echo "Roll back from the Railway and Vercel dashboards if the"
            echo "live QA env is in a broken state."
          } >> "$GITHUB_STEP_SUMMARY"
