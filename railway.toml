# Railway build config for the Fastify API service.
#
# Lives at the monorepo root because Railway treats the repo root as the
# build context — pnpm needs to see pnpm-workspace.yaml to wire up the
# @vivasvana/* workspace packages. The API service is selected via
# RAILWAY_SERVICE_ID in the deploy workflow.
#
# We use a Dockerfile rather than Nixpacks because Railway's nixpacks
# builder doesn't reliably detect pnpm 9 in a monorepo with workspace:
# protocol dependencies. The Dockerfile gives us deterministic builds
# we can also run locally with `docker build -f apps/api/Dockerfile .`.

[build]
builder = "dockerfile"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
# Health-check the API once Railway flips traffic. The Fastify /health
# route returns 200 once Prisma has connected — exactly the readiness
# signal we want before the new instance starts serving.
healthcheckPath = "/health"
healthcheckTimeout = 30

# Restart if the process exits with a non-zero code, but cap retries so a
# crash-loop doesn't burn CPU credits forever.
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
