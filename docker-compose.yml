# Local-dev sidecars NOT covered by `supabase start`.
# Supabase CLI provides: Postgres (54322), GoTrue (54321), Storage, Studio.
# This compose adds: Redis for cart/session caching.
#
# Usage:
#   docker compose up -d
#   supabase start
#
# Stop:
#   supabase stop
#   docker compose down

services:
  redis:
    image: redis:7-alpine
    container_name: vivasvana-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
